<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>upfile</title>

    <script type="text/javascript">

        function signOut() {
            $.ajax({
                url: "/sso/sso/signOut.do",
                type: "post", //GET
                async: true,    //或false,是否异步
                data: {},
                xhrFields: {
                    withCredentials: true
                },
                crossDomain: true,
                timeout: 5000,    //超时时间
                dataType: 'json',    //返回的数据格式：json/xml/html/script/jsonp/text
                success: function (result) {
                    if (result != null) {
                        if (!result.success) {
                            alert(result.message);
                        } else {
                            alert(result.message);
                            location.href = result.object;
                        }

                    } else {
                        alert("没有数据");
                    }
                }
            });
        }



    </script>
</head>
<body>

<form action="/webiodemo/IOController/upFile.file" enctype='multipart/form-data' method="post">
    <input name="fileName" type="file"/>
    <input type="submit" value="提交"/>
</form>

<form action="/sso/sso/signOut.do" method="post">
    <input type="submit" value="退出">
</form>


</body>
</html>
