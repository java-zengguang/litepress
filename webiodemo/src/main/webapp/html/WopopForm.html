<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">

    <title>Wopop</title>
    <link href="../Wopop_files/style_log.css" rel="stylesheet" type="text/css">
    <link href="../Wopop_files/style.css" rel="stylesheet" type="text/css">
    <link href="../Wopop_files/userpanel.css" rel="stylesheet" type="text/css">
    <link href="../Wopop_files/jquery.ui.all.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.staticfile.org/jquery/3.2.1/jquery.min.js"></script>

    <script type="text/javascript">
        function submit() {
            $.ajax({
                url: "../sso/login.do",
                type: "post", //GET
                async: true,    //或false,是否异步
                data: $('#form1').serialize(),
                timeout: 5000,    //超时时间
                dataType: 'json',    //返回的数据格式：json/xml/html/script/jsonp/text
                success: function (result) {
                    if (result != null) {
                        if (!result.success) {
                            alert(result.message);
                        } else {
                            alert(result.message);
                        }

                    } else {
                        alert("没有数据");
                    }
                }
            });
        }




    </script>
</head>

<body class="login" mycollectionplug="bind">
<div class="login_m">
    <div class="login_logo"><img height="46" src="../Wopop_files/logo.png" width="196"></div>
    <div class="login_boder">

        <div class="login_padding" id="login_model">
            <form action="../sso/login.do" id="form1" method="post">

                <h2>USERNAME</h2>
                <label>
                    <input class="txt_input txt_input2" id="username" name="username"
                           onblur="if (value ==&#39;&#39;){value=&#39;Your name&#39;}"
                           onfocus="if (value ==&#39;Your name&#39;){value =&#39;&#39;}"
                           type="text" value="Your name">
                </label>
                <h2>PASSWORD</h2>
                <label>
                    <input class="txt_input" id="userpwd" name="password"
                           onblur="if (value ==&#39;&#39;){value=&#39;******&#39;}"
                           onfocus="if (value ==&#39;******&#39;){value =&#39;&#39;}"
                           type="password" value="******">
                </label>


                <p class="forgot"><a href="javascript:void(0);" id="iforget">Forgot your password?</a></p>
                <div class="rem_sub">
                    <div class="rem_sub_l">
                        <input id="save_me" name="checkbox" type="checkbox">
                        <label for="checkbox">Remember me</label>
                    </div>
                    <label>
                        <input class="sub_button" id="button" name="button" style="opacity: 0.7;" type="submit"
                               value="SIGN-IN">
                    </label>
                </div>

            </form>

        </div>

        <div class="copyrights">Collect from <a href="http://www.cssmoban.com/">用户登陆</a></div>

        <div class="login_padding" id="forget_model" style="display:none">
            <br>

            <h1>Forgot password</h1>
            <br>
            <div class="forget_model_h2">(Please enter your registered email below and the system will automatically
                reset users’ password and send it to user’s registered email address.)
            </div>
            <label>
                <input class="txt_input txt_input2" id="usrmail" type="text">
            </label>


            <div class="rem_sub">
                <div class="rem_sub_l">
                </div>
                <label>

                    <input class="sub_buttons" id="Retrievenow" name="button" style="opacity: 0.7;" type="submit"
                           value="Retrieve now"/>
                    　　　
                    <input class="sub_button" id="denglu" name="button" style="opacity: 0.7;" type="submit"
                           value="Return"/>　　

                </label>
            </div>
        </div>


        <!--login_padding  Sign up end-->
    </div><!--login_boder end-->
</div><!--login_m end-->
<br> <br>
<p align="center"> More Templates <a href="http://www.cssmoban.com/" target="_blank" title="模板之家">模板之家</a> - Collect
    from <a href="http://www.cssmoban.com/" target="_blank" title="网页模板">网页模板</a></p>


</body>
</html>
