<div class="easyui-layout" data-options="fit:true">
    <div data-options="region:'west',border:true,split:true," title="角色管理" style="width:150px; padding:5px;">
        <ul id="wu-role-tree" class="easyui-tree"></ul>
    </div>
    <div data-options="region:'center',border:false">
        <!-- Begin of toolbar -->
        <div id="role-toolbar">
            <div class="wu-toolbar-button">
                <a href="#" class="easyui-linkbutton" iconCls="icon-add" onclick="openAdd()" plain="true">添加</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-edit" onclick="openEdit()" plain="true">修改</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-remove" onclick="remove()" plain="true">删除</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-cancel" onclick="cancel()" plain="true">取消</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-reload" onclick="reload()" plain="true">刷新</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-print" onclick="openAdd()" plain="true">打印</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-help" onclick="openEdit()" plain="true">帮助</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-undo" onclick="remove()" plain="true">撤销</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-redo" onclick="cancel()" plain="true">重做</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-sum" onclick="reload()" plain="true">总计</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-back" onclick="reload()" plain="true">返回</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-tip" onclick="reload()" plain="true">提示</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-save" onclick="reload()" plain="true">保存</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-cut" onclick="reload()" plain="true">剪切</a>
            </div>
            <div class="wu-toolbar-search">
                <label>起始时间：</label><input class="easyui-datebox" style="width:100px">
                <label>结束时间：</label><input class="easyui-datebox" style="width:100px">
                <label>用户组：</label>
                <select class="easyui-combobox" panelHeight="auto" style="width:100px">
                    <option value="0">选择用户组</option>
                    <option value="1">黄钻</option>
                    <option value="2">红钻</option>
                    <option value="3">蓝钻</option>
                </select>
                <label>关键词：</label><input class="wu-text" style="width:100px">
                <a href="#" class="easyui-linkbutton" iconCls="icon-search">开始检索</a>
            </div>
        </div>
        <!-- End of toolbar -->
        <table id="role-datagrid" toolbar="#role-toolbar"></table>
    </div>
</div>
<!-- Begin of easyui-dialog -->
<div id="role-dialog" class="easyui-dialog" data-options="closed:true,iconCls:'icon-save'"
     style="width:400px; padding:10px;">
    <form id="role-form" method="post">
        <table>
            <input type="hidden" name="role.id" value="0"/>
            <tr>
                <td width="60" align="right">名 称:</td>
                <td><input type="text" name="role.name" class="wu-text"/></td>
            </tr>
            <tr>
                <td align="right">简　介:</td>
                <td><input type="text" name="role.introduce" class="wu-text"/></td>
            </tr>

        </table>
    </form>
</div>

<!-- End of easyui-dialog -->
<script type="text/javascript">
    /**
     * Name 载入菜单树
     */
    $('#wu-role-tree').tree({
        url: '../temp/menu.json',
        onClick: function (node) {
            alert(node.text);
        }
    });

    /**
     * Name 获取roleID
     */
    function getRoleList() {
        $.ajax({
            url: '/role/getRoleList.do',
            data: '',
            success: function (data) {
                var str = "";
                if (data.success) {
                    $.each(data.object, function (i, role) {
                        str = str + "<option value='" + role.id + "'>" + role.name + "</option>";
                    });
                    $('#roleList').empty().append(str);
                } else {
                    alert(data.message);
                }
            }
        });
    }

    /**
     * Name 添加记录
     */
    function add() {
        $('#role-form').form('submit', {
            url: '/role/insertRole.do',
            success: function (data) {
                var data = eval('(' + data + ')'); // change the JSON string to javascript object
                if (data.success) {
                    $.messager.alert('信息提示', '提交成功！', 'info');
                    $('#role-dialog').dialog('close');
                    reload();
                } else {
                    $.messager.alert('信息提示', '提交失败！', 'info');
                }
            }
        });
    }

    /**
     * Name 修改记录
     */
    function edit() {

        //  var id= $('#role-datagrid').datagrid('getSelections');
        $('#role-form').form('submit', {
            url: '/role/editRole.do',
            /*   onSubmit: function(role){
                   role.id = id;
               },*/
            success: function (data) {
                if (data) {
                    $.messager.alert('信息提示', '提交成功！', 'info');
                    $('#role-dialog').dialog('close');
                    reload();
                } else {
                    $.messager.alert('信息提示', '提交失败！', 'info');
                }
            }
        });
    }

    /**
     * Name 删除记录
     */
    function remove() {
        $.messager.confirm('信息提示', '确定要删除该记录？', function (result) {
            if (result) {
                var items = $('#role-datagrid').datagrid('getSelections');
                //var ids = [];
                var ids = "";
                $(items).each(function () {
                    //ids.push(this.id);
                    ids = ids + this.id + ",";
                });
                //alert(ids);return;
                $.ajax({
                    url: '/role/deleteRoles.do',
                    data: 'ids=' + ids,
                    success: function (data) {
                        //var data = eval('(' + data + ')'); // change the JSON string to javascript object
                        if (data.success) {
                            $.messager.alert('信息提示', '提交成功！', 'info');
                            reload();
                        } else {
                            $.messager.alert('信息提示', '删除失败！', 'info');
                        }
                    }
                });
            }
        });
    }

    /**
     * Name 打开添加窗口
     */
    function openAdd() {
        $('#role-form').form('clear');
        $('#role-dialog').dialog({
            closed: false,
            modal: true,
            title: "添加信息",
            buttons: [{
                text: '确定',
                iconCls: 'icon-ok',
                handler: add
            }, {
                text: '取消',
                iconCls: 'icon-cancel',
                handler: function () {
                    $('#wu-dialog').dialog('close');
                }
            }]
        });
    }

    /**
     * Name 打开修改窗口
     */
    function openEdit() {
        $('#role-form').form('clear');
        var item = $('#role-datagrid').datagrid('getSelected');
        //alert(item.productid);return;
        $.ajax({
            url: '/role/getRoleList.do',
            data: 'role.id=' + item.id,
            success: function (data) {
                if (!data.success) {
                    $('#role-dialog').dialog('close');
                } else {

                    // var jsonstr=JSON.stringify(data.object[0]);
                    data = data.object[0];
                    //绑定值
                    $('#role-form').form('load', {
                        'role.id': data.id,
                        'role.name': data.name,
                        'role.introduce': data.introduce
                    });
                }
            }
        });
        $('#role-dialog').dialog({
            closed: false,
            modal: true,
            title: "修改信息",
            buttons: [{
                text: '确定',
                iconCls: 'icon-ok',
                handler: edit
            }, {
                text: '取消',
                iconCls: 'icon-cancel',
                handler: function () {
                    $('#role-dialog').dialog('close');
                }
            }]
        });
    }


    function reload() {
        $('#role-datagrid').datagrid('reload');
    }

    /**
     * Name 分页过滤器
     */
    function pagerFilter(data) {
        data = data.object;
        //alert(data);
        if (typeof data.length == 'number' && typeof data.splice == 'function') {// is array
            data = {
                total: data.length,
                rows: data
            }
        }
        //alert(data);
        var dg = $(this);
        var opts = dg.datagrid('options');
        var pager = dg.datagrid('getPager');
        pager.pagination({
            onSelectPage: function (pageNum, pageSize) {
                opts.pageNumber = pageNum;
                opts.pageSize = pageSize;
                pager.pagination('refresh', {pageNumber: pageNum, pageSize: pageSize});
                dg.datagrid('loadData', data);
            }
        });
        if (!data.originalRows) {
            data.originalRows = (data.rows);
        }
        var start = (opts.pageNumber - 1) * parseInt(opts.pageSize);
        var end = start + parseInt(opts.pageSize);
        data.rows = (data.originalRows.slice(start, end));
        return data;
    }

    /**
     * Name 载入数据
     */
    $('#role-datagrid').datagrid({
        url: '/role/getRoleList.do',
        loadFilter: pagerFilter,
        rownumbers: true,
        singleSelect: false,
        pageSize: 20,
        pagination: true,
        multiSort: true,
        fitColumns: true,
        fit: true,
        columns: [[
            {checkbox: true},
            {field: 'id', title: 'ID', width: 100, sortable: true},
            {field: 'name', title: '名称', width: 180, sortable: true},
            {field: 'powers', title: '权限', width: 100},
            {field: 'introduce', title: '简介', width: 100},
            {field: 'status', title: '用户状态', width: 100}
        ]]
    });
</script>
