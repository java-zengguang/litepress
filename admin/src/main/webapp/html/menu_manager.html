
<div class="easyui-layout" data-options="fit:true">
    <div data-options="region:'west',border:true,split:true," title="菜单管理" style="width:150px; padding:5px;">
        <ul id="wu-menu-tree" class="easyui-tree"></ul>
    </div>
    <div data-options="region:'center',border:false">
    	<!-- Begin of toolbar -->
        <div id="menu-toolbar">
            <div class="wu-toolbar-button">
                <a href="#" class="easyui-linkbutton" iconCls="icon-add" onclick="openAdd()" plain="true">添加</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-edit" onclick="openEdit()" plain="true">修改</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-remove" onclick="remove()" plain="true">删除</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-cancel" onclick="cancel()" plain="true">取消</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-reload" onclick="reload()" plain="true">刷新</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-print" onclick="openAdd()" plain="true">打印</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-help" onclick="openEdit()" plain="true">帮助</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-undo" onclick="remove()" plain="true">撤销</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-redo" onclick="cancel()" plain="true">重做</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-sum" onclick="reload()" plain="true">总计</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-back" onclick="reload()" plain="true">返回</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-tip" onclick="reload()" plain="true">提示</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-save" onclick="reload()" plain="true">保存</a>
                <a href="#" class="easyui-linkbutton" iconCls="icon-cut" onclick="reload()" plain="true">剪切</a>
            </div>
            <div class="wu-toolbar-search">
                <label>起始时间：</label><input class="easyui-datebox" style="width:100px">
                <label>结束时间：</label><input class="easyui-datebox" style="width:100px">
                <label>用户组：</label> 
                <select class="easyui-combobox" panelHeight="auto" style="width:100px">
                    <option value="0">选择用户组</option>
                    <option value="1">黄钻</option>
                    <option value="2">红钻</option>
                    <option value="3">蓝钻</option>
                </select>
                <label>关键词：</label><input class="wu-text" style="width:100px">
                <a href="#" class="easyui-linkbutton" iconCls="icon-search">开始检索</a>
            </div>
        </div>
        <!-- End of toolbar -->
        <table id="menu-treegrid" toolbar="#menu-toolbar"></table>
    </div>
</div>
<!-- Begin of easyui-dialog -->
<div id="menu-dialog" class="easyui-dialog" data-options="closed:true,iconCls:'icon-save'" style="width:400px; padding:10px;">
	<form id="menu-form" method="post">
        <table>
<!--
           <input type="hidden" name="menuInfo.id" value="0"  />
-->
            <tr>
                <td width="60" align="right">父级:</td>
                <td> <input type="text"  name="parentText" class="wu-text" disabled="true" /></td>
            </tr>
            <tr>
                <td width="60" align="right">PID:</td>
                <td><input type="text" name="menuInfo.pid" class="wu-text" readonly="true" /></td>
            </tr>
            <tr>
                <td width="60" align="right">LEVEL:</td>
                <td><input type="text" name="menuInfo.level" class="wu-text" readonly="true" /></td>
            </tr>
            <tr>
                <td width="60" align="right">文 本:</td>
                <td><input type="text" name="menuInfo.text" class="wu-text" /></td>
            </tr>
            <tr>
                <td align="right">URL:</td>
                <td><input type="text" name="menuInfo.url" class="wu-text" /></td>
            </tr>
            <tr>
                <td align="right">ICON:</td>
                <td><input type="text" name="menuInfo.icon" class="wu-text" /></td>
            </tr>
            </tr>


            <!-- <tr>
                 <td valign="top" align="right">内 容:</td>
                 <td><textarea name="content" rows="6" class="wu-textarea" style="width:260px"></textarea></td>
             </tr>-->
        </table>
    </form>
</div>

<!-- End of easyui-dialog -->
<script type="text/javascript">
	/**
	* Name 载入菜单树
	*/
	$('#wu-menu-tree').tree({
		url:'/menu/getRootMenu.do?id=1&level=0&type=tree',
		onClick:function(node){
			alert(node.text);
		}
	});



	/**
	* Name 添加记录
	*/
	function add(){
		$('#menu-form').form('submit', {
			url:'/menu/insertMenu.do',
            success:function(data){
                var data = eval('(' + data + ')'); // change the JSON string to javascript object
				if(data.success){
					$.messager.alert('信息提示','提交成功！','info');
					$('#menu-dialog').dialog('close');
					reload();
				}
				else
				{
					$.messager.alert('信息提示','提交失败！','info');
				}
			}
		});
	}
	
	/**
	* Name 修改记录
	*/
	function edit(){

	    var items= $('#menu-treegrid').treegrid('getSelected');
		$('#menu-form').form('submit', {
			url:'/menu/updateMenu.do',
            onSubmit: function(param){
                param.id = items.id;
            },
			success:function(data){
				if(data){
					$.messager.alert('信息提示','提交成功！','info');
					$('#menu-dialog').dialog('close');
					reload();
				}
				else
				{
					$.messager.alert('信息提示','提交失败！','info');
				}
			}
		});
	}
	
	/**
	* Name 删除记录
	*/
	function remove(){
		$.messager.confirm('信息提示','确定要删除该记录？', function(result){
			if(result){
				var items = $('#menu-treegrid').datagrid('getSelections');
				//var ids = [];
                var ids="";
				$(items).each(function(){
					//ids.push(this.id);
                    ids=ids+this.id+",";
				});
				//alert(ids);return;
				$.ajax({
					url:'/user/deleteUsers.do',
					data:'ids='+ids,
					success:function(data){
                        //var data = eval('(' + data + ')'); // change the JSON string to javascript object
                        if(data.success){
                            $.messager.alert('信息提示','提交成功！','info');
                            reload();
                        }
						else
						{
							$.messager.alert('信息提示','删除失败！','info');		
						}
					}	
				});
			}	
		});
	}
	
	/**
	* Name 打开添加窗口
	*/
	function openAdd(){
		$('#menu-form').form('clear');
        var item = $('#menu-treegrid').datagrid('getSelected');
        //alert(item.productid);return;
        $.ajax({
            url:'/menu/getMenu.do',
            data:'id='+item.id,
            success:function(data){
                if(!data.success){
                    $('#menu-dialog').dialog('close');
                }
                else{

                    // var jsonstr=JSON.stringify(data.object[0]);
                    data=data.object[0];
                    //绑定值
                    $('#menu-form').form('load',{'menuInfo.pid':data.id,'parentText':data.text,'menuInfo.level':data.level+1});
                }
            }
        });
		$('#menu-dialog').dialog({
			closed: false,
			modal:true,
            title: "添加信息",
            buttons: [{
                text: '确定',
                iconCls: 'icon-ok',
                handler: add
            }, {
                text: '取消',
                iconCls: 'icon-cancel',
                handler: function () {
                    $('#menu-dialog').dialog('close');
                }
            }]
        });
	}
	
	/**
	* Name 打开修改窗口
	*/
	function openEdit(){
		$('#menu-form').form('clear');
		var item = $('#menu-treegrid').treegrid('getSelected');
		//alert(item.productid);return;
		$.ajax({
			url:'/menu/getMenu.do',
			data:'id='+item.id,
			success:function(data){
				if(!data.success){
					$('#menu-dialog').dialog('close');
				}
				else{

				   // var jsonstr=JSON.stringify(data.object[0]);
                    data=data.object[0];
					//绑定值
                    $('#menu-form').form('load',{'menuInfo.pid':data.pid,'menuInfo.id':data.id,'menuInfo.level':data.level,'menuInfo.text':data.text,'menuInfo.url':data.url,'menuInfo.icon':data.icon});

                }
			}	
		});
		$('#menu-dialog').dialog({
			closed: false,
			modal:true,
            title: "修改信息",
            buttons: [{
                text: '确定',
                iconCls: 'icon-ok',
                handler: edit
            }, {
                text: '取消',
                iconCls: 'icon-cancel',
                handler: function () {
                    $('#menu-dialog').dialog('close');
                }
            }]
        });
	}


    function reload() {
        $('#menu-treegrid').treegrid('reload');
    }
	
	/**
	* Name 分页过滤器
	*/
	function pagerFilter(data){
	    data= data.object;
	    //alert(data);
		if (typeof data.length == 'number' && typeof data.splice == 'function'){// is array                
			data = {                   
				total: data.length,                   
				rows: data               
			}            
		}
		//alert(data);
		var dg = $(this);         
		var opts = dg.datagrid('options');          
		var pager = dg.datagrid('getPager');          
		pager.pagination({                
			onSelectPage:function(pageNum, pageSize){                 
				opts.pageNumber = pageNum;                   
				opts.pageSize = pageSize;                
				pager.pagination('refresh',{pageNumber:pageNum,pageSize:pageSize});                  
				dg.datagrid('loadData',data);                
			}          
		});           
		if (!data.originalRows){               
			data.originalRows = (data.rows);       
		}         
		var start = (opts.pageNumber-1)*parseInt(opts.pageSize);          
		var end = start + parseInt(opts.pageSize);        
		data.rows = (data.originalRows.slice(start, end));         
		return data;       
	}
	
	/**
	* Name 载入数据
	*/
    $('#menu-treegrid').treegrid({
        url:'/menu/getRootMenu.do?id=1&level=0&type=table',
        idField:'id',
        treeField:'text',
        animate:'true',
        rownumbers:true,
        singleSelect:false,
        multiSort:true,
        fitColumns:true,
        fit:true,
        columns:[[
            {title:'文本',field:'text',width:180},
            {field:'id',title:'id',width:60,align:'right'},
            {field:'pid',title:'pid',width:60,align:'right'},
            {field:'level',title:'level',width:80},
            {field:'status',title:'status',width:80},
            {field:'url',title:'url',width:80},
            {field:'icon',title:'icon',width:80}

        ]]
    });
</script>
